# src-tauri/Cargo.toml
[package]
name = "abeos-control-center"
version = "1.0.0"
description = "AbeOS Control Center"
authors = ["Abe"]
edition = "2021"

[lib]
name = "abeos_control_center_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
walkdir = "2"
